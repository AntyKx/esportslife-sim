name: ab
on:
  workflow_dispatch:
    inputs:
      games:
        description: 每組場數
        default: '100'
jobs:
  ab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base, mirror: '', noplayer: ''}
          - {name: noplayer, mirror: '', noplayer: '1'}
          - {name: mirror, mirror: '1', noplayer: ''}
          - {name: mirror-noplayer, mirror: '1', noplayer: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run
        env:
          MACRO: macro.js
          MIRROR: ${{ matrix.mirror }}
          NOPLAYER: ${{ matrix.noplayer }}
          NODEC: '1'
        run: node sim/report.cjs ${{ inputs.games }} 0.7 | tee result.json
      - uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.name }}
          path: result.json
