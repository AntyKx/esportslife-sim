name: ab
on:
  workflow_dispatch:
    inputs:
      games:
        description: 每組場數
        default: '100'
jobs:
  ab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: blue-first-0.7, macro: macro.js, iq: '0.7', rev: ''}
          - {name: red-first-0.7, macro: macro.js, iq: '0.7', rev: '1'}
          - {name: blue-first-0.95, macro: macro.js, iq: '0.95', rev: ''}
          - {name: red-first-0.95, macro: macro.js, iq: '0.95', rev: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run
        env:
          MACRO: ${{ matrix.macro }}
          NODEC: '1'
          REVERSE: ${{ matrix.rev }}
        run: node sim/report.cjs ${{ inputs.games }} ${{ matrix.iq }} | tee result.json
      - uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.name }}
          path: result.json
